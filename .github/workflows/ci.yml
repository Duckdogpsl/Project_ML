name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: tomato-serving:ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Lint
        run: ruff check .

      - name: Build image
        run: docker build -t $IMAGE .

      - name: Validate data
        run: >
          docker run --rm -v ${{ github.workspace }}:/app
          -e DATA_DIR=dataset/sample $IMAGE
          python scripts/01.1_data_validation.py --data-root dataset/sample

      - name: Preprocess
        run: >
          docker run --rm -v ${{ github.workspace }}:/app
          -e DATA_DIR=dataset/sample $IMAGE
          python scripts/01.2_preprocess.py

      - name: Train, evaluate, register
        run: >
          docker run --rm -v ${{ github.workspace }}:/app
          -e DATA_DIR=dataset/sample -e GIT_COMMIT=${{ github.sha }} $IMAGE
          python scripts/02_train_evaluate_register.py

      - name: Start serving
        run: docker run -d --name serving -p 8000:8000 -v ${{ github.workspace }}:/app $IMAGE

      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' serving)
            [ "$status" = healthy ] && exit 0
            sleep 5
          done
          docker logs serving
          exit 1

      - name: Integration tests
        run: |
          export TEST_IMAGE="$(find dataset/sample/test -name '*.jpg' | head -1)"
          pytest tests/test_serving_api.py

      - name: Show serving logs on failure
        if: failure()
        run: docker logs serving

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/duckdogpsl/project_ml:latest
            ghcr.io/duckdogpsl/project_ml:${{ github.sha }}