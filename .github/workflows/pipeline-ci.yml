name: Pipeline CI
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-monitoring.txt
      - name: Check pipeline code
        run: >-
          ruff check scripts/09_auto_pipeline.py scripts/01.2_preprocess.py
          scripts/02_train_evaluate_register.py scripts/05_model_serving.py
          scripts/06_prepare_monitoring_data.py scripts/07_evidently_drift.py
          scripts/common.py tests/test_auto_pipeline.py
      - name: Test retries, rollback, and feature compatibility
        run: python -m pytest tests/test_auto_pipeline.py -q
